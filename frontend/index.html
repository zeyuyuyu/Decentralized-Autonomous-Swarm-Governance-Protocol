<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwarmGov - Level Up Your Governance!</title>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/confetti-js"></script>
</head>
<body class="bg-gradient-to-br from-purple-900 via-indigo-800 to-blue-900 min-h-screen text-white">
    <div id="achievement-popup" class="hidden fixed top-5 right-5 bg-green-500 p-4 rounded-lg shadow-lg z-50 animate-bounce">
        <h3 class="font-bold">🏆 Achievement Unlocked!</h3>
        <p id="achievement-text"></p>
    </div>
    
    <nav class="p-4 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <img src="logo.png" class="w-10 h-10" alt="SwarmGov Logo">
            <h1 class="text-2xl font-bold">SwarmGov</h1>
        </div>
        <div class="flex items-center gap-4">
            <span class="px-3 py-1 bg-purple-700 rounded-full">Level: <span id="user-level">1</span></span>
            <span class="px-3 py-1 bg-purple-700 rounded-full">XP: <span id="user-xp">0</span>/100</span>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Governance Panel -->
            <div class="bg-white/10 p-6 rounded-xl backdrop-blur-sm">
                <h2 class="text-xl font-bold mb-4">Active Proposals</h2>
                <div id="proposals" class="space-y-4"></div>
            </div>

            <!-- Social & Achievements -->
            <div class="space-y-8">
                <div class="bg-white/10 p-6 rounded-xl backdrop-blur-sm">
                    <h2 class="text-xl font-bold mb-4">🏆 Your Achievements</h2>
                    <div class="grid grid-cols-3 gap-4" id="achievements">
                        <!-- Achievement badges go here -->
                    </div>
                </div>

                <div class="bg-white/10 p-6 rounded-xl backdrop-blur-sm">
                    <h2 class="text-xl font-bold mb-4">🏅 Global Leaderboard</h2>
                    <div id="leaderboard" class="space-y-2"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Share Modal -->
    <div id="share-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
        <div class="bg-white text-black p-6 rounded-xl max-w-md w-full">
            <h3 class="text-xl font-bold mb-4">🎉 Share Your Achievement!</h3>
            <p class="mb-4">I just earned the "<span id="share-achievement-name"></span>" badge on SwarmGov! Join me in shaping the future of decentralized governance!</p>
            <div class="flex gap-4">
                <button onclick="shareToTwitter()" class="flex-1 bg-blue-400 text-white p-2 rounded">Share on Twitter</button>
                <button onclick="closeShareModal()" class="bg-gray-200 px-4 rounded">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Gamification System
        let userXP = 0;
        let userLevel = 1;
        const achievements = [
            { id: 'first_vote', name: 'First Vote', icon: '🗳️', xp: 50 },
            { id: 'proposal_creator', name: 'Proposal Pioneer', icon: '✨', xp: 100 },
            { id: 'community_leader', name: 'Community Leader', icon: '👑', xp: 200 },
            { id: 'governance_guru', name: 'Governance Guru', icon: '🎓', xp: 500 },
            { id: 'super_voter', name: 'Super Voter', icon: '⭐', xp: 1000 }
        ];

        function unlockAchievement(achievementId) {
            const achievement = achievements.find(a => a.id === achievementId);
            if (!achievement) return;

            // Show achievement popup
            const popup = document.getElementById('achievement-popup');
            document.getElementById('achievement-text').textContent = `${achievement.icon} ${achievement.name}`;
            popup.classList.remove('hidden');
            setTimeout(() => popup.classList.add('hidden'), 3000);

            // Add XP
            addXP(achievement.xp);

            // Show share modal
            showShareModal(achievement.name);

            // Trigger confetti
            const confettiSettings = { target: 'confetti-canvas' };
            const confetti = new ConfettiGenerator(confettiSettings);
            confetti.render();
            setTimeout(() => confetti.clear(), 3000);
        }

        function addXP(amount) {
            userXP += amount;
            while (userXP >= 100) {
                userXP -= 100;
                userLevel++;
                // Level up animation and sound effect could be added here
            }
            document.getElementById('user-xp').textContent = userXP;
            document.getElementById('user-level').textContent = userLevel;
        }

        function showShareModal(achievementName) {
            document.getElementById('share-modal').classList.remove('hidden');
            document.getElementById('share-achievement-name').textContent = achievementName;
        }

        function closeShareModal() {
            document.getElementById('share-modal').classList.add('hidden');
        }

        function shareToTwitter() {
            const achievementName = document.getElementById('share-achievement-name').textContent;
            const text = `I just earned the "${achievementName}" badge on SwarmGov! Join me in shaping the future of decentralized governance! 🚀 #SwarmGov #Web3 #Governance`;
            window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`);
        }

        // Initialize demo content
        window.onload = () => {
            // Simulate unlocking an achievement after 2 seconds
            setTimeout(() => unlockAchievement('first_vote'), 2000);
        };
    </script>

    <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none"></canvas>
</body>
</html>
